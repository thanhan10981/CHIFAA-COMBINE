name: CHIFAA standalone
on:
  push:
    paths: ['web/**', 'supabase/**', 'scripts/build-postgres-schema.mjs', '.github/workflows/standalone.yml']
  pull_request:
    paths: ['web/**', 'supabase/**', 'scripts/build-postgres-schema.mjs', '.github/workflows/standalone.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run db:types
      - run: git diff --exit-code -- lib/database/generated.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
