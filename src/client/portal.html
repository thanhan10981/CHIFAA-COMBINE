<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Chifaa · Đặt hàng</title><!--STYLE--></head><body><main style="max-width:700px;margin:auto;padding:30px 18px"><div class="card pad"><div style="display:flex;align-items:center;gap:22px"><img src="__LOGO__" alt="Chifaa" width="110" height="110" style="object-fit:contain;border-radius:15px"><div><span class="eyebrow">CHIFAA COMBINE</span><h1 style="font-size:30px;margin:7px 0">Đặt món cho ngày mới</h1><p id="destination" class="muted">Đang kiểm tra thư mời…</p></div></div><div class="notice">Đơn hàng sẽ được xác nhận sau khi Chifaa duyệt. Thông tin đặt hàng không cấp quyền vào ứng dụng nội bộ.</div><form id="order-form"><div class="form-grid"><label class="field">Tên khách<input name="customer" required maxlength="200"></label><label class="field">Liên hệ<input name="contact" required maxlength="200"></label><label class="field">Ngày giao<input name="date" type="date" required></label><label class="field">Ca giao<input name="shift" required placeholder="Ví dụ: buổi sáng"></label><label class="field">Món bán<select name="dishId" id="dishes" required><option value="">Chọn món</option></select></label><label class="field">Số lượng<input name="quantity" type="number" min="1" step="1" required value="1"></label></div><button id="send-order" type="submit" class="button primary" disabled>Gửi đơn đặt hàng</button></form><p id="order-status" role="status" class="muted"></p></div></main><!--PORTAL--></body></html>
