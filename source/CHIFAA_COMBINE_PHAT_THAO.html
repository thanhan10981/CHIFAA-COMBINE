/* CHIFAA — Đồng bộ thanh điều hướng và trải nghiệm trình bày */
.sidebar{width:282px;flex:0 0 282px;padding:20px 12px 16px;scrollbar-color:#415b76 transparent;scrollbar-width:thin}
.sidebar .menu-title{margin:23px 12px 10px;font-size:10px;font-weight:780;color:#8ca0b6;letter-spacing:1.55px}
.sidebar .navitem{width:100%;min-width:0;display:grid;grid-template-columns:21px minmax(0,1fr) auto;align-items:center;column-gap:11px;text-align:left;margin:2px 0;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:#c4d2e2;font-size:12.5px;line-height:1.45;font-weight:620;min-height:41px;box-shadow:none;transition:background .16s,color .16s,border-color .16s}

.sidebar .nav-icon,.sidebar .navgroup-icon{height:21px;width:21px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#a8c5dd}
.sidebar .nav-icon svg,.sidebar .navgroup-icon svg{height:16px;width:16px;display:block}
.sidebar .navitem.active .nav-icon,.sidebar .navitem:hover .nav-icon{color:#fff}
.sidebar .nav-label{min-width:0;overflow-wrap:break-word;word-break:normal;white-space:normal}
.sidebar .navitem small{margin:0;justify-self:end;border:0;background:#35516a;color:#fff;border-radius:999px;min-width:26px;text-align:center;padding:3px 7px;font-size:10px}
.sidebar .navitem.active small{background:#ffffff30}
.sidebar .navgroup{width:100%;display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 11px;margin:12px 0 0;min-height:46px;border:1px solid #3d5872;border-radius:11px;background:#203a54;color:#eff5fa;box-shadow:none;transition:background .18s,border-color .18s;letter-spacing:.2px;font-size:12px;font-weight:800;line-height:1.35}
.sidebar .navgroup:hover{background:#2a4763;border-color:#65819b}
.sidebar .navgroup:focus-visible,.sidebar .navitem:focus-visible{outline:2px solid #ffa359;outline-offset:2px}
.sidebar .navgroup.is-open{border-color:#54718d;background:#24415b}
.sidebar .navgroup-left{display:flex;min-width:0;align-items:center;gap:10px;text-align:left}
.sidebar .navgroup-icon{color:#c1d5e6}
.sidebar .navgroup-label{min-width:0;overflow-wrap:anywhere}
.sidebar .nav-chevron{height:23px;width:23px;flex:none;border-radius:7px;background:#ffffff10;color:#d8e7f2;display:grid;place-items:center;transition:transform .2s ease,background .2s}
.sidebar .nav-chevron svg{display:block;height:16px;width:16px;transform:rotate(0deg);transition:transform .2s}
.sidebar .navgroup.is-open .nav-chevron svg{transform:rotate(180deg)}
.sidebar .nav-children{margin:7px 1px 13px 12px;padding:0 0 0 10px;border-left:1px solid #49617c;display:block}
.sidebar .nav-children.collapsed{display:none}
.sidebar .nav-children .navitem{font-size:12px;margin:2px 0;padding:10px 9px;min-height:40px;border-radius:9px;column-gap:9px;grid-template-columns:19px minmax(0,1fr) auto}
.sidebar .nav-children .navitem .nav-icon{width:19px;height:19px}
.sidebar .nav-children .navitem .nav-icon svg{height:15px;width:15px}
.sidebar .logo{padding:3px 7px 18px;gap:10px}
.sidebar .logo h1{font-size:15px;letter-spacing:.4px;white-space:nowrap}
.sidebar .side-bottom{padding:15px 10px 0;margin-top:18px;color:#9fb1c4;line-height:1.65}
.sidebar .preview-footer-note{display:block;margin-top:4px;color:#8fa5ba;font-size:10.5px}

.demo-banner{background:#f6f9fc;border:1px solid #e2eaf1;color:#53697d;border-radius:11px;padding:12px 15px;line-height:1.6}

function getName(id){return materials.find(x=>x.id===id)?.name||recipes.find(x=>x.id===id)?.name||id}
function getMaterial(id){return materials.find(x=>x.id===id)}
function lineCost(item,stack=[]){const mat=getMaterial(item.id);if(mat){if(mat.price===null||mat.price===undefined||mat.price===0)return 0;
 const u=String(mat.unit).toLowerCase();if(u==='kg'&&item.unit==='g')return (+item.qty||0)*mat.price/1000;
 if(u==='kg'&&item.unit==='kg')return (+item.qty||0)*mat.price;
 if(u==='túi (16 vắt )'&&item.unit==='vắt')return (+item.qty||0)*mat.price/16;
 if(u===item.unit.toLowerCase())return (+item.qty||0)*mat.price;
 return 0;}
 const linked=recipes.find(x=>x.id===item.id);if(linked&&!stack.includes(linked.id)){return (+item.qty||0)*recipeTotal(linked,[...stack,linked.id])/Math.max(1,linked.yield)}return 0}
function recipeTotal(rec,stack=[]){return rec.items.reduce((sum,item)=>sum+lineCost(item,stack.includes(rec.id)?stack:[...stack,rec.id]),0)}
function costPer(rec){return recipeTotal(rec)/Math.max(rec.yield,1)}
function missingRows(rec,seen=[]){if(seen.includes(rec.id))return [];
 let out=[];for(const it of rec.items){let mat=getMaterial(it.id);if(mat){let u=String(mat.unit).toLowerCase(), q=it.unit.toLowerCase();let good=(u==='kg'&&(q==='g'||q==='kg'))||(u===q)||(u.includes('16 vắt')&&q==='vắt');
 if(mat.price==null||mat.price===0||!good)out.push(it.id+(!good?' (đơn vị/quy cách chưa chuẩn)':' (thiếu giá)'));
 }else{let link=recipes.find(x=>x.id===it.id);if(link)out.push(...missingRows(link,[...seen,rec.id]));else out.push(it.note||it.id+' (chưa có danh mục)')}}return [...new Set(out)]}
function flags(rec){return missingRows(rec).length}

function header(title,desc,action=''){return `<div class="headline"><div><div class="eyebrow">CHIFAA COMBINE / QUẢN LÝ VẬN HÀNH</div><h2>${title}</h2><p class="sub">${desc}</p></div>${action}</div>`}

function statCards(){return `<div class="stats"><div class="stat"><div><label>Món ăn đang quản lý</label><strong>${recipes.filter(r=>r.type==='dish').length}</strong><span>Có công thức định lượng</span></div><div class="stat-icon">▤</div></div><div class="stat"><div><label>Công thức nhân / sốt</label><strong>${recipes.filter(r=>r.type==='batch').length}</strong><span>Quy đổi theo số phần / mẻ</span></div><div class="stat-icon">◈</div></div><div class="stat"><div><label>Vật tư trong danh mục</label><strong>${materials.length}</strong><span>Đơn giá và nhóm vật tư</span></div><div class="stat-icon">▦</div></div><div class="stat"><div><label>Vật tư chưa có giá</label><strong>${materials.filter(x=>!x.price).length}</strong><span>Cần cập nhật để tính đúng cost</span></div><div class="stat-icon">!</div></div></div>`}
function renderRecipes(){let batch=page==='batches';let list=recipes.filter(x=>x.type===(batch?'batch':'dish'));let chosen=recipes.find(r=>r.id===selected&&r.type===(batch?'batch':'dish'));if(!chosen){chosen=list[0];selected=chosen?.id;}let search=batch?batchQuery:query;list=list.filter(x=>(x.name+' '+x.id+' '+x.group).toLowerCase().includes(search.toLowerCase()));return header(batch?'Công thức nhân & bán thành phẩm':'Công thức món & định lượng',batch?'Quản lý từng mẻ nhân, sốt; tự tính chi phí cho mỗi phần thành phẩm.':'Mỗi món có công thức riêng; liên kết nguyên liệu, bao bì và công thức nhân từ danh mục.',btnAdd(batch?'Tạo công thức mẻ':'Thêm công thức món',`openRecipeModal('${batch?'batch':'dish'}')`))+
`<div class="demo-banner">✦ &nbsp; Công thức được tổng hợp từ tài liệu nguồn. Tổng tính thử không thay thế giá vốn thật vì một số giá, quy cách và định lượng trong file gốc còn chưa thống nhất.</div>`+statCards()+`<div class="split"><section class="card"><div class="card-head"><div><h3>${batch?'Danh sách công thức mẻ':'Danh sách món ăn'}</h3><p>${list.length} công thức${search?' phù hợp tìm kiếm':''}</p></div></div><div class="filterbar"><div class="search-wrap"><span class="search-ico">⌕</span><input class="field" value="${safe(search)}" id="recipeSearch" placeholder="Tìm mã hoặc tên công thức..." oninput="updateRecipeSearch(this.value)"></div></div><div class="recipe-list" id="recipeList">${recipeListHtml(list,batch)}</div><div style="padding:12px 17px;color:#98a4b2;font-size:11px;border-top:1px solid var(--line)">Chọn một công thức để xem định lượng và chi tiết giá vốn.</div></section><section class="card detail" id="recipeDetail">${chosen?detailHtml(chosen):'<div class="empty">Chưa có công thức nào.</div>'}</section></div>`}
function recipeListHtml(list,batch){if(!list.length)return `<div class="empty">Không tìm thấy công thức phù hợp.</div>`;return list.map(r=>`<button class="recipe-row ${selected===r.id?'on':''} ${batch?'batch':''}" onclick="selectRecipe('${safe(r.id)}')"><span class="initial">${getIcon(r.type)}</span><span class="rec-text"><b title="${safe(r.name)}">${safe(r.name)}</b><small>${safe(r.id)} · ${safe(r.group)} · ${fmt(r.yield)} ${safe(r.yieldUnit)}/mẻ</small></span><span class="rec-cost">${fmt(costPer(r))}đ</span></button>`).join('')}

function unitPrice(item){let m=getMaterial(item.id);if(m)return m.price;let r=recipes.find(r=>r.id===item.id);return r?costPer(r):0}
function detailHtml(rec){let total=recipeTotal(rec);let isBatch=rec.type==='batch';let recipeRows=rec.items.map((item,i)=>{let m=getMaterial(item.id),r=recipes.find(x=>x.id===item.id),val=lineCost(item,[rec.id]);let isWeight=m?.unit==='kg';let unitTxt=r?'đ/phần':isWeight?'đ/kg':'đ/'+safe(m?.unit||item.unit);let conv=isWeight?`${f2(item.qty*(item.unit==='g'?0.001:1))} kg`:'—';let per=isBatch?`${f2(item.qty/Math.max(1,rec.yield))} ${safe(item.unit)}`:'—';return `<tr><td class="center">${i+1}</td><td class="linkish">${safe(item.id)}</td><td>${safe(getName(item.id))}${r?`<div><span class="badge badge-blue">Công thức liên kết</span></div>`:''}</td><td class="center">${safe(item.unit)}</td><td class="right strong">${f2(item.qty)}</td>${isBatch?`<td class="right">${per}</td>`:''}<td class="right">${conv}</td><td class="right">${fmt(unitPrice(item))} <span class="muted">${unitTxt}</span></td><td class="right strong">${fmt(val)}</td></tr>`}).join('');return `<div class="detail-head"><div class="detail-top"><div><span class="badge ${isBatch?'badge-blue':'badge-orange'}">${isBatch?'CÔNG THỨC NHÂN / SỐT':'CÔNG THỨC MÓN ĂN'}</span> <span class="badge badge-gray">${safe(rec.id)}</span></div><div class="detail-actions"><button class="btn btn-icon" title="Nhân bản công thức" onclick="cloneRecipe('${safe(rec.id)}')">⧉</button><button class="btn btn-soft" onclick="openRecipeModal('${safe(rec.type)}','${safe(rec.id)}')">✎ Chỉnh sửa</button></div></div><h3>${safe(rec.name)}</h3><div class="meta">Nhóm: ${safe(rec.group)} &nbsp;·&nbsp; Định mức tham khảo</div>${rec.note?`<div class="recipe-note"><strong>Ghi chú từ công thức:</strong> ${safe(rec.note)}</div>`:''}${missingRows(rec).length?`<div class="recipe-note"><strong>Chưa xác định giá/quy cách:</strong> ${safe(missingRows(rec).slice(0,9).join(', '))}${missingRows(rec).length>9?'…':''}</div>`:''}<div class="pillrow"><div class="pill"><label>${isBatch?'Sản lượng mỗi mẻ':'Đơn vị bán'}</label><b>${fmt(rec.yield)} ${safe(rec.yieldUnit)}</b></div><div class="pill"><label>Giá vốn ${isBatch?'1 mẻ':'toàn công thức'}</label><b class="${!total?'zero':''}">${fmt(total)} đ</b></div><div class="pill"><label>Giá vốn / ${safe(rec.yieldUnit)}</label><b>${fmt(costPer(rec))} đ</b></div><div class="pill"><label>Số thành phần</label><b>${rec.items.length}</b></div></div></div><div class="section-label"><span>CHI TIẾT ĐỊNH LƯỢNG & GIÁ VỐN</span><span class="badge ${flags(rec)?'badge-orange':'badge-green'}">${flags(rec)?flags(rec)+' dòng chưa xác định giá/quy cách':'Các thành phần đã có giá'}</span></div><div class="tablebox"><table class="table"><thead><tr><th>STT</th><th>Mã SP</th><th>Nguyên liệu / Thành phần</th><th>ĐVT</th><th class="right">Định lượng</th>${isBatch?'<th class="right">/ 1 phần</th>':''}<th class="right">Quy đổi</th><th class="right">Đơn giá</th><th class="right">Thành tiền</th></tr></thead><tbody>${recipeRows}<tr class="foot"><td colspan="${isBatch?8:7}">TỔNG COST / ${fmt(rec.yield)} ${safe(rec.yieldUnit)}</td><td class="right">${fmt(total)} đ</td></tr></tbody></table></div><div class="note"><strong>Nguyên tắc tính:</strong> Vật tư có ĐVT <b>kg</b> thì lượng <b>g</b> được chia 1.000 trước khi nhân đơn giá; công thức nhân/sốt có thể liên kết vào món theo giá vốn trên một phần. <br>Dòng thiếu đơn giá hoặc chưa chuẩn quy cách chỉ tạm tính <b>0đ</b>, vì vậy giá vốn mô phỏng <b>không phải giá vốn chính thức</b>. Không tự suy ra định lượng chưa có trong file gốc.</div>`}
function renderCatalog(){let groups=['Tất cả',...new Set(materials.map(x=>x.group))];let arr=materials.filter(x=>((x.name+x.id+x.group).toLowerCase().includes(catalogQuery.toLowerCase()))&&(filter==='all'||x.group===filter));return header('Danh mục vật tư & đơn giá','Cơ sở vật tư dùng chung cho mọi công thức; quy đổi gram về kilogram khi tính giá vốn.',btnAdd('Thêm vật tư','openMaterialModal()'))+`<div class="demo-banner">✦ &nbsp; Danh mục vật tư liên kết với định lượng công thức. Nhập mã hoặc tên vật tư để xác định đúng ĐVT và đơn giá.</div>`+`<div class="stats"><div class="stat"><div><label>Tổng mã vật tư</label><strong>${materials.length}</strong><span>Danh mục dùng chung</span></div><div class="stat-icon">▦</div></div><div class="stat"><div><label>Nguyên liệu tính theo kg</label><strong>${materials.filter(m=>m.unit==='kg').length}</strong><span>Công thức nhập g hoặc kg</span></div><div class="stat-icon">⚖</div></div><div class="stat"><div><label>Nhóm vật tư</label><strong>${new Set(materials.map(m=>m.group)).size}</strong><span>Phân loại để quản lý</span></div><div class="stat-icon">◫</div></div><div class="stat"><div><label>Chưa có đơn giá</label><strong>${materials.filter(m=>!m.price).length}</strong><span>Cần cập nhật bảng giá</span></div><div class="stat-icon">!</div></div></div><section class="card"><div class="card-head"><div><h3>Bảng danh mục vật tư</h3><p>Giá vật tư được nhập theo ĐVT mua hàng chuẩn trong danh mục.</p></div><div class="filters"><div class="search-wrap"><span class="search-ico">⌕</span><input class="field" style="width:225px" id="catalogSearch" placeholder="Tìm tên hoặc mã SP..." value="${safe(catalogQuery)}" oninput="catalogQuery=this.value;renderCatalogTable()"></div><select class="field" id="groupFilter" onchange="filter=this.value;renderCatalogTable()">${groups.map(g=>`<option value="${g==='Tất cả'?'all':safe(g)}" ${filter===(g==='Tất cả'?'all':g)?'selected':''}>${safe(g)}</option>`).join('')}</select></div></div><div id="catalogTable">${catalogTableHtml(arr)}</div></section>`}
function renderCatalogTable(){let arr=materials.filter(x=>(x.name+x.id+x.group).toLowerCase().includes(catalogQuery.toLowerCase())&&(filter==='all'||x.group===filter));document.getElementById('catalogTable').innerHTML=catalogTableHtml(arr)}
function catalogTableHtml(arr){return `<div class="tablebox catalog-body"><table class="table big-table"><thead><tr><th>STT</th><th>Mã SP</th><th>Tên vật tư</th><th>Nhóm</th><th>ĐVT trong nguồn</th><th class="right">Đơn giá</th><th class="right">Tồn tối thiểu</th><th class="right">Tồn hiện tại</th><th>Quy cách</th><th>Tình trạng</th><th></th></tr></thead><tbody>${arr.map((m,i)=>`<tr><td>${i+1}</td><td class="linkish">${safe(m.id)}</td><td class="strong">${safe(m.name)}</td><td>${safe(m.group)}</td><td><span class="badge badge-gray">${safe(m.rawUnit||m.unit)}</span></td><td class="right strong">${m.price==null?'—':fmt(m.price)+' đ'}</td><td class="right">${m.minStock==null?'—':f2(m.minStock)}</td><td class="right">${m.stock==null?'<span class="badge badge-orange">Chưa có số liệu</span>':f2(m.stock)}</td><td>${m.packQty==null?'—':fmt(m.packQty)}</td><td><span class="badge ${m.price>0?'badge-green':'badge-orange'}">${m.price>0?'Có giá':'Giá 0 / chưa nhập'}</span></td><td><button class="sm-btn" onclick="openMaterialModal('${safe(m.id)}')">Xem / sửa</button></td></tr>`).join('')||'<tr><td colspan="11" style="text-align:center;padding:35px">Không có dữ liệu.</td></tr>'}</tbody></table></div>`}
function renderSpecial(){let isRice=page==='rice',arr=recipes.filter(r=>isRice?r.id==='B-RICE':r.id.startsWith('PK-'));
 return header(isRice?'Công thức cơm chín & hiệu suất':'Định mức bao bì từng đơn vị bán',isRice?'Theo dõi chuyển đổi gạo khô thành cơm chín, sản lượng và giá vốn':'Bao bì được quản lý như công thức riêng, có thể tái sử dụng trong nhiều món.',`<button class="btn btn-soft" onclick="navigate('batches')">Xem danh sách công thức →</button>`)
 + `<div class="subcards">${(isRice?[['1.000 g','Gạo khô / 1 mẻ','Theo công thức'],['2.500 g','Cơm chín chốt trong thông số chung','Chi tiết công thức lại ghi 2.300g'],['6,40 đ/g','Giá cơm chín theo thông số chung','16.000đ / 2.500g']]:[['55 đ','Tem cơm nắm / 1 phần','Giá tham chiếu trong công thức'],['877 đ','Bao bì cơm cuộn / 1 hộp','450 + 120 + 230 + 77'],['2','Nhóm định mức bao bì','Liên kết trực tiếp trong món']]).map(x=>`<div class="subcard"><small>${safe(x[1])}</small><strong>${safe(x[0])}</strong><p>${safe(x[2])}</p></div>`).join('')}</div>`+
 arr.map(x=>`<section class="card" style="padding:0;margin-top:15px">${detailHtml(x)}</section>`).join('') + `<div class="warning-list"><strong>Chú ý trước khi triển khai thực tế</strong><p>${isRice?'Cần chốt khối lượng cơm chín thực tế: 2.300g hay 2.500g cho một mẻ.':'Giá và quy cách bao bì ở bảng công thức đang khác hoặc thiếu so với danh mục. Không tự thay số liệu gốc.'}</p></div>`;}
function toggleSection(id){const name=id==='danhmuc'?'Danhmuc':id==='sanxuat'?'Sanxuat':'Congthuc';const el=document.getElementById('children'+name);el.classList.toggle('collapsed');document.getElementById('arrow'+name).textContent=el.classList.contains('collapsed')?'›':'⌄';}
function renderCost(){let dishes=recipes.filter(r=>r.type==='dish');return header('Tổng hợp giá vốn từng món','Bảng giá vốn tham khảo lấy trực tiếp từ định lượng và đơn giá của danh mục vật tư.',`<button class="btn btn-soft" onclick="navigate('catalog')">▦ Cập nhật đơn giá vật tư</button>`)+`<div class="demo-banner">✦ &nbsp; Một số giá/quy cách trong dữ liệu nguồn chưa đầy đủ hoặc không đồng nhất. Giá vốn chỉ tính từ các thành phần có đủ đơn giá; kết quả cần được đối chiếu trước khi sử dụng chính thức.</div>`+`<div class="stats"><div class="stat"><div><label>Tổng món ăn</label><strong>${dishes.length}</strong><span>Danh sách tổng hợp</span></div><div class="stat-icon">▤</div></div><div class="stat"><div><label>Giá vốn 1 phần cơm (114 g)</label><strong>730đ</strong><span>Giá gạo 16.000 đ/kg</span></div><div class="stat-icon">⚖</div></div><div class="stat"><div><label>Định mức cơm 1 mẻ</label><strong>2.500g</strong><span>Theo bảng gốc</span></div><div class="stat-icon">▦</div></div><div class="stat"><div><label>Đơn giá gạo</label><strong>16.000đ</strong><span>Giá 1 kg (tham chiếu)</span></div><div class="stat-icon">◫</div></div></div><section class="card"><div class="card-head"><div><h3>Giá vốn / đơn vị bán</h3><p>Chi phí từ sheet gốc được giữ riêng để đối chiếu với phần tính toán mô phỏng.</p></div></div><div class="tablebox"><table class="table"><thead><tr><th>STT</th><th>Tên món</th><th>Đơn vị bán</th><th class="right">Cost / đơn vị</th><th class="right">Thành phần có giá</th><th>Ghi chú</th><th></th></tr></thead><tbody>${dishes.map((r,i)=>{let known=r.items.filter(it=>getMaterial(it.id)?.price>0).length;return `<tr><td>${i+1}</td><td class="strong">${safe(r.name)}</td><td>1 ${safe(r.yieldUnit)}</td><td class="right strong">${fmt(costPer(r))} đ</td><td class="right">${known}/${r.items.length}</td><td><span class="badge badge-orange">${known<r.items.length?'Cost chưa đủ':'Tham khảo'}</span></td><td><button class="sm-btn" onclick="selected='${safe(r.id)}';navigate('recipes')">Chi tiết →</button></td></tr>`}).join('')}</tbody></table></div></section>`}
function renderDashboard(){return header('Tổng quan quản lý công thức','Tổng hợp công thức, định lượng và chi phí nguyên liệu phục vụ quản lý vận hành.',`<button class="btn btn-primary" onclick="navigate('recipes')">Xem công thức →</button>`)+statCards()+`<div class="info-grid"><div class="card"><h3>◈ Công thức nhân / sốt</h3><p>Quản lý mẻ thành phẩm, số phần, định lượng gram và cost mỗi phần. Có thể dùng công thức mẻ làm thành phần của món ăn.</p><br><button class="btn btn-soft" onclick="navigate('batches')">Xem công thức mẻ →</button></div><div class="card"><h3>▦ Danh mục vật tư</h3><p>Đơn giá chuẩn theo kg / cái / lá, liên kết với định lượng của tất cả công thức.</p><br><button class="btn btn-soft" onclick="navigate('catalog')">Xem danh mục →</button></div></div><div class="card"><div class="card-head"><div><h3>Danh sách công việc chuẩn hóa dữ liệu</h3><p>Các bước cần xác nhận trước khi đưa vào sử dụng</p></div></div><div style="padding:22px;color:#68798c;font-size:13px;line-height:2">① Đối chiếu mã vật tư với danh mục Excel hiện có.<br>② Cập nhật đơn giá mua hàng và quy đổi đơn vị chuẩn.<br>③ Hoàn chỉnh công thức nhân/sốt, không tự tính bằng ô riêng.<br>④ Liên kết công thức nhân theo số phần sử dụng cho từng món.<br>⑤ Đối chiếu kết quả giá vốn với Dashboard cũ trước khi đưa vào hoạt động.</div></div>`}

let masterQuery='',masterFilter='all';
function renderMaster(){
 const title={stores:'Danh mục điểm bán',dishes:'Danh mục món bán',employees:'Danh mục nhân viên',discounts:'Bảng chiết khấu'}[page];
 const rows=page==='stores'?stores:page==='dishes'?dishes:page==='employees'?employees:discounts;
 const heads={stores:['Mã ĐB','Tên điểm bán','Địa chỉ','CK hiện hành','Thao tác'],dishes:['Mã món','Tên món','Đơn vị bán','Giá bán','Cost cũ','Thao tác'],employees:['Mã NV','Tên nhân viên','Số điện thoại','Lương/giờ','Phụ cấp (đ)','Ghi chú','Thao tác'],discounts:['Mã ĐB','Tên điểm bán','Mức chung','Số món áp dụng','Thời điểm','Thao tác']}[page];
 const hint={stores:'Các điểm bán thực tế trong dữ liệu nguồn, liên kết với bảng chiết khấu.',dishes:'Danh mục 11 món và giá bán/giá vốn ghi trong bảng gốc. Giá vốn gốc để đối chiếu, không tự xem là cost tính lại.',employees:'Thêm phụ cấp bằng tiền (đ) cho từng nhân viên. Phụ cấp cũ chưa có dữ liệu nên để trống, không tự tính bằng 0. Chỉ hiển thị nhân viên có tên trong file.',discounts:'Mức chiết khấu chung và quy tắc theo từng món tại mỗi điểm bán. Chỉ lấy 11 cột món được xác định.'}[page];
 const query=masterQuery.toLocaleLowerCase('vi');
 const filtered=rows.filter(r=>JSON.stringify(r).toLocaleLowerCase('vi').includes(query));
 const data=filtered.map((r,i)=>{
 let cells=[];
 if(page==='stores')cells=[r.id,r.name,r.address,f2(r.discount)+'%'];
 if(page==='dishes')cells=[r.id,r.name,r.unit,r.price==null?'—':fmt(r.price)+' đ',r.legacyCost==null?'—':fmt(r.legacyCost)+' đ'];
 if(page==='employees')cells=[r.id,r.name,r.phone||'—',r.hourly==null?'—':fmt(r.hourly)+' đ',r.allowance==null?'Chưa nhập':fmt(r.allowance)+' đ',r.note||'—'];
 if(page==='discounts'){let s=stores.find(x=>x.id===r.store);cells=[r.store,s?.name||'—',r.rate==null?'—':f2(r.rate)+'%',Object.values(r.items).filter(Boolean).length+'/'+dishes.length,r.start||'Không giới hạn'];}
 return `<tr>${cells.map((v,j)=>`<td class="${j===1?'strong':''}">${safe(v)}</td>`).join('')}<td><button class="sm-btn" onclick="openMasterModal('${page}',${rows.indexOf(r)})">Chi tiết / sửa</button></td></tr>`;
 });
 return header(title,hint,btnAdd('Thêm mới',`openMasterModal('${page}',-1)`))+`<div class="demo-banner">✦ Thông tin danh mục được sử dụng để tham chiếu cho công thức và báo cáo. Các điều chỉnh trong bản xem trước chưa ảnh hưởng dữ liệu Google Sheets.</div><div class="stats"><div class="stat"><div><label>Tổng mục dữ liệu</label><strong>${rows.length}</strong><span>Đã nhập từ bảng gốc</span></div><div class="stat-icon">▦</div></div><div class="stat"><div><label>Đang hiển thị</label><strong id="masterShown">${filtered.length}</strong><span>Theo bộ lọc</span></div><div class="stat-icon">⌕</div></div><div class="stat"><div><label>${page==='discounts'?'Món có CK':'Danh mục liên kết'}</label><strong>${page==='discounts'?dishes.length:materials.length}</strong><span>Dùng chung toàn hệ thống</span></div><div class="stat-icon">◫</div></div><div class="stat"><div><label>Trạng thái</label><strong style="font-size:18px">Xem trước</strong><span>Dữ liệu tham khảo</span></div><div class="stat-icon">◈</div></div></div><section class="card"><div class="card-head"><div><h3>${title}</h3><p>Hiển thị dữ liệu từ bản bạn cung cấp</p></div><div class="search-wrap"><span class="search-ico">⌕</span><input class="field" id="masterSearch" style="width:260px" placeholder="Tìm mã / tên..." value="${safe(masterQuery)}" oninput="masterQuery=this.value;renderMasterRows()"></div></div><div id="masterTable">${masterTable(heads,data)}</div></section>`;
}
function masterTable(heads,rows){return `<div class="tablebox"><table class="table"><thead><tr>${heads.map(h=>`<th>${safe(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${heads.length}" style="padding:35px;text-align:center">Không có bản ghi</td></tr>`}</tbody></table></div>`}
function renderMasterRows(){let el=document.getElementById('masterTable');if(!el)return;let v=document.getElementById('masterSearch')?.value||'';masterQuery=v;let cur=document.activeElement;let pos=cur?.selectionStart;let root=document.getElementById('mainContent');root.innerHTML=renderMaster();let input=document.getElementById('masterSearch');input.focus();input.setSelectionRange(pos,pos)}
function openMasterModal(kind,index){let rows=kind==='stores'?stores:kind==='dishes'?dishes:kind==='employees'?employees:discounts;let o=rows[index]||{};let titles={stores:'Điểm bán',dishes:'Món bán',employees:'Nhân viên',discounts:'Chiết khấu'};

 let form='';
 if(kind==='stores')form=field('id','Mã điểm bán',o.id)+field('name','Tên điểm bán',o.name)+field('address','Địa chỉ',o.address)+field('discount','CK hiện hành (%)',o.discount,'number');
 if(kind==='dishes')form=field('id','Mã món',o.id)+field('name','Tên món',o.name)+field('unit','Đơn vị bán',o.unit)+field('price','Giá bán (đ)',o.price,'number')+field('legacyCost','Cost tham chiếu từ bảng gốc (đ)',o.legacyCost,'number');

// CHIFAA COMBINE V5: production planning, recursive raw-material demand, variance reconciliation.
const PROD_STORAGE_KEY='chifaa_combine_v5_demo_records';
const fallbackDemo={};
const pad2=x=>String(x).padStart(2,'0');
function localDate(d=new Date()){return [d.getFullYear(),pad2(d.getMonth()+1),pad2(d.getDate())].join('-')}
function dateShift(date,amount){const [y,m,day]=date.split('-').map(Number),d=new Date(y,m-1,day+amount);return localDate(d)}
function vnd(n){return Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:0})+' đ'}
function dec(n,d=2){return Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:d})}
function count(n){return Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:0})}
function parseAmt(v){const n=Number(v);return Number.isFinite(n)&&n>=0?n:0}
let prodDate=dateShift(localDate(),1), demandDate=prodDate, auditDate=dateShift(localDate(),-1);
let demandMode='planned',reportPeriod='rolling7',reportAnchor=dateShift(localDate(),-1);
let prodRecords=[];
const RAW_STOCK_RULES={
  XX:{unit:'túi',factor:.5,caption:'Túi 500g (cần xác nhận quy cách)'},
  PMS:{unit:'túi',factor:.5,caption:'Túi 500g (cần xác nhận)'},
  DH:{unit:'can',factor:2.2,caption:'Can 2.200g'},
  DM:{unit:'chai',factor:.25,caption:'Chai 250g'},
  BO:{unit:'hộp',factor:.8,caption:'Hộp 800g'},
  RCM:{unit:'bì',factor:100,caption:'Bì 100 lá (cần xác nhận)'},
  RCC:{unit:'bì',factor:100,caption:'Bì 100 lá (cần xác nhận)'},
  TG:{unit:'vỉ',factor:30,caption:'Vỉ 30 quả (cần xác nhận)'},
  ĐUA:{unit:'túi',factor:100,caption:'Túi 100 đôi (cần xác nhận)'},
  MY:{unit:'túi',factor:16,caption:'Túi 16 vắt'}
};
function stockUnit(id,base){const m=getMaterial(id);const unit=base==='kg'?'kg':base==='quả'?'quả':base==='lá'?'lá':base==='vắt'?'vắt':base==='cái'?'cái':base;const custom=RAW_STOCK_RULES[id];if(custom)return {unit:custom.unit,factor:custom.factor,note:custom.caption};return {unit:unit,factor:1,note:base==='kg'?'1 kg = 1.000 g':''};}
function newDay(date){return {date,status:'draft',demo:false,items:{},audits:{},snapshot:null,updatedAt:null};}
function buildDemoHistory(){const sample=[130,145,140,155,120,160,150], now=localDate(),all=[];
  for(let i=0;i<7;i++){
    const dt=dateShift(now,i-7), d=newDay(dt);d.demo=true;d.status='reconciled';
    d.items['CN-XXPM']={planned:sample[i],produced:sample[i],delivered:sample[i],sold:sample[i],returned:0};
    d.items['CN-TERI']={planned:25+i,produced:25+i,delivered:25+i,sold:23+i,returned:2};
    d.items['CC']={planned:15+i,produced:15+i,delivered:15+i,sold:15+i,returned:0};
    d.snapshot=calculateNeed(d,'produced');
    const modifiers={GAD:1.06,XX:1.04,CB:1.08,UC:1.035,RCM:1.02};
    for(const [id,mul] of Object.entries(modifiers)){
      const r=d.snapshot.entries[id]; if(!r||!r.qty)continue;
      const used=r.qty*mul, start=Math.max(r.qty*3,10);
      d.audits[id]={opening:+start.toFixed(4),inbound:0,closing:+(start-used).toFixed(4),other:0};
    }
    all.push(d);
  }
  const tomorrow=newDay(dateShift(now,1));tomorrow.items['CN-XXPM']={planned:100,produced:0,delivered:0,sold:0,returned:0};tomorrow.demo=true;all.push(tomorrow);
  return all;
}
function loadProd(){try{const value=localStorage.getItem(PROD_STORAGE_KEY);if(value){const arr=JSON.parse(value);if(Array.isArray(arr))return arr;}}catch(e){}return buildDemoHistory();}
function persistProd(){try{localStorage.setItem(PROD_STORAGE_KEY,JSON.stringify(prodRecords));return true}catch(e){return false}}
function dayAt(dt){let day=prodRecords.find(x=>x.date===dt);if(!day){day=newDay(dt);prodRecords.push(day)}return day}
function lineAt(day,id){if(!day.items[id])day.items[id]={planned:0,produced:0,delivered:0,sold:0,returned:0};return day.items[id]}
// Flatten a dish or nested semi-finished recipe to inventory units.
// Formula for a nested item: item.qty / batch.yield * each batch's ingredient quantities.
function flattenFormula(recipeId,quantity,out,issues,path=[]){
  if(!Number.isFinite(quantity)||quantity<=0)return;
  if(path.includes(recipeId)){issues.add('Công thức bị tham chiếu vòng: '+[...path,recipeId].join(' → '));return;}
  let mat=getMaterial(recipeId);
  if(mat){
    // Raw material quantities are passed here via addRaw(), so this branch is only a safety fallback.
    issues.add('Chưa xác định đơn vị vật tư '+recipeId);return;
  }
  const r=recipes.find(x=>x.id===recipeId);
  if(!r){issues.add('Thiếu công thức: '+recipeId);return;}
  if(!r.items.length){issues.add(r.name+': chưa có định lượng chi tiết');return;}
  if(!Number.isFinite(+r.yield)||+r.yield<=0){issues.add('Sản lượng mẻ không hợp lệ: '+r.name);return;}
  const mult=quantity/(+r.yield);
  for(const item of r.items){
    const q=Number(item.qty||0)*mult;
    if(!q)continue;
    const raw=getMaterial(item.id);
    if(raw)addRaw(raw,item.unit,q,out,issues);
    else if(recipes.some(x=>x.id===item.id))flattenFormula(item.id,q,out,issues,[...path,recipeId]);
    else if(item.id==='WATER')issues.add('Nước nấu cơm chưa có mã vật tư và chưa tính vào báo cáo kho');
    else issues.add('Thiếu mã vật tư/công thức: '+item.id);
  }
}
function addRaw(mat,unit,qty,out,issues){
  const inUnit=String(unit||'').trim().toLowerCase();let base=inUnit, v=qty;
  if(inUnit==='g'){base='kg';v=qty/1000}
  else if(inUnit==='kg'){base='kg';v=qty}
  else if(inUnit==='lá'){base='lá'}
  else if(inUnit==='quả'){base='quả'}
  else if(inUnit==='vắt'){base='vắt'}
  else if(inUnit==='cái'){base=mat.id==='ĐUA'?'đôi':'cái'}
  else if(inUnit==='hộp'||inUnit==='phần'||inUnit==='cây'||inUnit==='túi'){base=inUnit}
  if(mat.id==='TG'&&base==='quả')issues.add('Giá/ĐVT trứng gà chưa được chuẩn hóa; số lượng trứng được tính theo quả');
  if(mat.id==='ĐUA')issues.add('Đũa: quy cách túi/đôi chưa được xác minh');
  if(['RCM','RCC'].includes(mat.id))issues.add(mat.name+': đang dùng giả định 100 lá/bì; cần xác nhận');
  if(!out[mat.id])out[mat.id]={id:mat.id,name:mat.name,unit:base,qty:0,price:mat.price,group:mat.group};
  if(out[mat.id].unit!==base){issues.add('Vật tư '+mat.id+' có nhiều đơn vị khác nhau chưa quy đổi');return;}
  out[mat.id].qty+=v;
}
function calculateNeed(day,field){const out={},issues=new Set(),dishes=recipes.filter(x=>x.type==='dish');
 for(const d of dishes){const li=day.items[d.id];const units=Number(li?.[field]||0);if(units>0)flattenFormula(d.id,units,out,issues,[])}
 return {entries:out,issues:[...issues],source:field,generatedAt:new Date().toISOString()};
}
function selectedSnapshot(day){return day.status!=='draft'&&day.snapshot?day.snapshot:calculateNeed(day,'produced')}
function auditUsage(a){if(!a)return null;const keys=['opening','inbound','closing','other'];if(keys.some(k=>a[k]===undefined||a[k]===null||!Number.isFinite(Number(a[k]))))return null;return +a.opening + +a.inbound - +a.closing - +a.other}
function getDayNumbers(day){return Object.values(day.items).reduce((s,it)=>{for(const k of ['planned','produced','delivered','sold','returned'])s[k]+=Number(it[k]||0);return s},{planned:0,produced:0,delivered:0,sold:0,returned:0})}
function dayState(day){const n=getDayNumbers(day);if(day.status==='reconciled')return {label:'Đã đối soát',cls:'done'};if(day.status==='produced')return{label:'Đã chốt sản xuất',cls:'check'};if(n.planned)return{label:'Kế hoạch',cls:'plan'};return{label:'Chưa nhập',cls:'plan'}}
function fieldValue(dt,id,k,val){const d=dayAt(dt);lineAt(d,id)[k]=Math.max(0,Math.floor(parseAmt(val)));const banner=document.getElementById('planUnsaved');if(banner)banner.textContent='Có thay đổi chưa lưu — bấm nút Lưu kế hoạch / Chốt sản xuất';}
function validationOfDay(day,mode){for(const [id,it]of Object.entries(day.items)){
 const name=dishes.find(x=>x.id===id)?.name||id;
 if(it.delivered>it.produced)return name+': số giao không được lớn hơn số sản xuất.';
 if(it.sold+it.returned>it.delivered)return name+': bán + trả không được lớn hơn số giao.';
 if(mode==='reconciled'&&it.delivered>it.sold+it.returned)return name+': chưa xác nhận hết số đã giao (bán hoặc trả).';
 }return '';
}
function saveDay(mode){const d=dayAt(prodDate),err=validationOfDay(d,mode);if(err){alert(err);return;}
 if(mode!=='draft'&&getDayNumbers(d).produced===0){alert('Hãy nhập số lượng thực tế sản xuất trước khi chốt.');return;}
 d.status=mode;d.updatedAt=new Date().toISOString();d.demo=false;
 if(mode!=='draft')d.snapshot=calculateNeed(d,'produced');else d.snapshot=null;

hiết khấu</th><th>Thuần</th><th>Ghi chú</th></tr></thead><tbody>${rows}</tbody></table></div><div class="v9-totalnote"><b>Quy tắc ki-ốt:</b> hàng ế được trả về và ki-ốt bán lại sẽ được nhập vào dòng điểm bán ĐB09; phần hủy được ghi riêng ở Phiếu sản xuất – Lỗi – Hủy. Phiếu doanh thu không tự suy ra số hàng sản xuất.</div></div>${v9History('sales')}`}

-ốt bán lại được 8 phần, ghi doanh thu 8 ở ĐB09. Nếu 2 phần còn lại bị hủy, nhập số hủy 2 ở bảng B, dòng ĐB09.</div>${v9History('production')}`}

function v9Plans(){let p=v9DB.plans,target=p.targets;const t=[['foodCost','Food cost tối đa','% giá bán'],['laborCost','Labor cost tối đa','% doanh thu'],['defect','Lỗi sản xuất tối đa','% số lượng sản xuất'],['cancel','Hủy tại điểm bán tối đa','% hàng giao'],['minCash','Số dư tiền tối thiểu','đ']].map(([k,l,unit])=>`<div class="v9-field"><label>${l} (${unit})</label><input class="v9-input" type="number" min="0" step="any" value="${v9Esc(target[k]??'')}" onchange="v9SetPlan('${k}',this.value)"></div>`).join('');let rows=p.months.map((m,i)=>{let daily=v9Num(m.revenue)!==null&&v9Num(m.days)>0?m.revenue/m.days:null;return `<tr><td class="strong">${v9Esc(m.month.replace('-','/'))}</td><td><input type="number" step="1" min="0" class="v9-miniinput text" value="${v9Esc(m.revenue??'')}" onchange="v9MonthSet(${i},'revenue',this.value);render()"></td><td><input type="number" step="1" min="1" class="v9-miniinput" value="${v9Esc(m.days??'')}" onchange="v9MonthSet(${i},'days',this.value);render()"></td><td class="num strong">${v9Money(daily)}</td><td><input type="number" min="0" class="v9-miniinput text" value="${v9Esc(m.fixed??'')}" onchange="v9MonthSet(${i},'fixed',this.value)"></td><td><input type="number" class="v9-miniinput text" value="${v9Esc(m.profit??'')}" onchange="v9MonthSet(${i},'profit',this.value)"></td></tr>`}).join('');return v9Hero('05 · Kế hoạch & mục tiêu','Cài các ngưỡng cảnh báo và ngân sách tháng làm nguồn tham chiếu cho Dashboard.')+v9Banner()+v9Navbar()+`<div class="v9-info"><b>Dữ liệu kế hoạch từ file:</b> Tháng 11/2026 có mục tiêu doanh thu 260.000.000đ, chi phí cố định dự kiến 18.000.000đ, lợi nhuận mục tiêu 22.000.000đ. Các thay đổi được lưu trên thiết bị hiện tại.</div><div class="v9-panel"><div class="v9-panelhead"><h3>Tham số mục tiêu</h3><span class="v9-pill">Thay đổi lưu tự động trong bản xem trước</span></div><div class="v9-editor">${t}</div></div><div class="v9-panel"><div class="v9-panelhead"><h3>Kế hoạch theo tháng</h3><button class="v9-butto    v9Date=input;v9Mode='new';delete v9Drafts[type];v10Notes[type]='';render();return;
 }
 const old=v9Doc(type);

function v10ExistingSummary(type,doc){

 return `<div class="v10-workflow">
 ${v10Step(type,'today','Nhập hôm nay','Mặc định lấy ngày hiện tại',1)}
 ${v10Step(type,'back','Nhập bù','Một ngày trước đó chưa có phiếu',2)}

 </div><div class="v9-toolbar"><div class="v9-control"><label>Ngày ghi nhận (ngày nghiệp vụ)</label><input aria-label="Ngày ghi nhận" class="v9-input" type="date" max="${v10Today()}" value="${v9Date}" onchange="v10ChangeDate('${type}',this.value)"></div><div class="v9-control v10-note"><label>Lý do / ghi chú lần lưu (khuyến nghị)</label><input aria-label="Lý do lần lưu" class="v9-input" placeholder="Ví dụ: Chiều nhập bổ sung, sửa phiếu sai..." value="${v9Esc(v10Notes[type]||'')}" oninput="v10Notes['${type}']=this.value"></div><span class="v9-mode ${v9Mode==='new'?'':v9Mode}">${warning}</span><div class="v9-actions"><button type="button" class="v9-button primary" onclick="v9SaveDoc('${type}')">▣ ${v9Mode==='add'?'Lưu bổ sung':v9Mode==='edit'?'Lưu bản sửa':'Lưu phiếu'}</button><button type="button" class="v9-button" onclick="v10Exit('${type}')">↩ Thoát sửa / về nhập mới</button></div></div>
 <div class="v10-state ${cls}"><strong>${isOld?'Đã có phiếu ngày '+v10HumanDate(v9Date):'Ngày '+v10HumanDate(v9Date)}</strong><span>${text}</span>${isOld?`<span class="v10-stamp">${v10ExistingSummary(type,old)}</span>`:''}</div>
 <div class="v10-hintbox"><b>Quy tắc:</b> ${modeInfo} ${isOld&&v9Mode!=='new'?`<span style="display:block;margin-top:5px">Đã lưu lần cuối: ${v9Esc(v10FmtStamp(old.savedAt))} · ${v10ExistingSummary(type,old)}</span>`:''}</div>`;

function v10Exit(type){v9Mode='new';delete v9Drafts[type];v10Notes[type]='';render();}
function v10CopyDoc(type,d){
 if(!d)return v9MakeDraft(type);

function v10Merge(type,old,part){
 const next=v10CopyDoc(type,old);
 if(type==='production'){
  for(const [id,r] of Object.entries(part.products||{})){
   const a=next.products[id]||{};next.products[id]={qty:v9Int(a.qty)+v9Int(r.qty),bad:v9Int(a.bad)+v9Int(r.bad),note:[a.note,r.note].filter(Boolean).join(' / ')};
  }
  next.destroy=[...next.destroy,...(part.destroy||[])];next.returned=[...next.returned,...(part.returned||[])];return next;
 }
 if(type==='attendance'){
  for(const [id,r] of Object.entries(part.rows||{})){
   if(next.rows[id])next.extraShifts=[...(next.extraShifts||[]),{id,...v10Clone(r)}];
   else next.rows[id]=v10Clone(r);
  }
  return next;
 }
 for(const [id,r] of Object.entries(part.rows||{})){
  const p=next.rows[id]||{};
  if(type==='stock'){
   // Tồn đầu là số kiểm kê đầu ngày, KHÔNG cộng vào khi bổ sung.
   next.rows[id]={open:p.open??'',in:v9Int(p.in)+v9Int(r.in),out:v9Int(p.out)+v9Int(r.out),note:[p.note,r.note].filter(Boolean).join(' / ')};
  }else{
   const qty={...(p.qty||{})};for(const [dish,q] of Object.entries(r.qty||{}))qty[dish]=v9Int(qty[dish])+v9Int(q);

 }

}

function stgShift(n){const d=v15Date(stg.anchor);if(stg.period==='day')d.setDate(d.getDate()+n);else if(stg.period==='week')d.setDate(d.getDate()+7*n);else if(stg.period==='month')d.setMonth(d.getMonth()+n);else if(stg.period==='quarter')d.setMonth(d.getMonth()+3*n);else d.setFullYear(d.getFullYear()+n);const s=v15ISO(d);stg.anchor=s>v9IsoDate()?v9IsoDate():s;render()}
function stgPanel(title,subtitle,inner,wide=false){return `<section class="stg-panel ${wide?'stg-wide':''}"><div class="stg-panel-top"><div><h3>${title}</h3><p>${subtitle}</p></div><span class="stg-help" title="Các biểu đồ sẽ dùng dữ liệu theo bộ lọc. Nếu chọn phiếu đã lưu mà thiếu số liệu, chỉ số chưa được tính.">ⓘ</span></div><div class="stg-panel-body">${inner}</div></section>`}
const stgEmpty=(txt='Chưa có dữ liệu đủ điều kiện để lập biểu đồ.')=>`<div class="stg-empty"><span>▤</span><strong>Chưa đủ dữ liệu</strong><small>${txt}</small></div>`;
function stgLine(points,key='net'){
 const valid=points.filter(p=>Number.isFinite(p[key]));if(valid.length===0)return stgEmpty('Chưa có phiếu doanh thu trong giai đoạn đã chọn.');
 const W=760,H=230,L=65,T=18,R=17,B=47,max=Math.max(1,...valid.map(p=>p[key]))*1.16;
 const x=i=>L+(i*(W-L-R)/Math.max(1,points.length-1)),y=n=>T+(H-T-B)*(1-n/max);
 const segments=[];let s=[];points.forEach((p,i)=>{if(!Number.isFinite(p[key])){if(s.length)segments.push(s);s=[]}else s.push([x(i),y(p[key])])});if(s.length)segments.push(s);
 let circles=points.map((p,i)=>Number.isFinite(p[key])?`<circle cx="${x(i)}" cy="${y(p[key])}" r="4" fill="#e77933" stroke="#fff" stroke-width="2"><title>${safe(p.full)}: ${stgCash(p[key])}</title></circle>`:'').join('');
 const axis=[0,.25,.5,.75,1].map(p=>`<line x1="${L}" y1="${y(max*p)}" x2="${W-R}" y2="${y(max*p)}" stroke="#e8edf3" stroke-dasharray="3 4"/><text x="${L-10}" y="${y(max*p)+4}" text-anchor="end" fill="#8290a1" font-size="11">${stgShort(max*p)}</text>`).join('');
 const lines=segments.map(pts=>`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#e77933" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
 const ticks=points.map((p,i)=>`<text x="${x(i)}" y="${H-15}" text-anchor="middle" fill="#71859a" font-size="${points.length>12?9:11}">${safe(p.label)}</text>`).join('');
 return `<div class="stg-chart-scroll"><svg class="stg-line" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ đường doanh thu thuần">${axis}${lines}${circles}${ticks}</svg></div><div class="stg-chart-foot"><span><i class="stg-dot" style="background:#e77933"></i>Doanh thu thuần</span><span>${valid.length}/${points.length} kỳ có dữ liệu</span></div>`;
}
function stgHbars(rows,valueKey,labelFmt=stgCash,rate=false){if(!rows.length)return stgEmpty();let max=Math.max(1,...rows.map(r=>Math.abs(r[valueKey])||0));return `<div class="stg-bars">${rows.slice(0,8).map((r,i)=>{const n=r[valueKey]||0,p=Math.max(n>0?2:0,100*Math.abs(n)/max);return `<div class="stg-bar-row"><div class="stg-bar-label" title="${safe(r.name)}">${safe(r.name)}</div><div class="stg-bar-track"><span style="width:${p.toFixed(2)}%;background:${rate?(i<2?'#d76159':'#e0a3a0'):(i===0?'#e77933':'#86ac9b')}"></span></div><b>${labelFmt(n)}</b></div>`}).join('')}</div>`;}
function stgDonut(ag){if(!ag.hasCosts||!ag.days||!Number.isFinite(ag.net)||ag.net<=0)return stgEmpty('Cần dữ liệu chi phí thực tế và doanh thu cùng kỳ để xem cơ cấu.');
 const profit=ag.net-(ag.food+ag.prodLabor+ag.office+ag.marketing+ag.dep+ag.fixed+ag.other);
 const raw=[['Giá vốn nguyên liệu',ag.food],['Nhân sự sản xuất',ag.prodLabor],['Nhân sự quản lý',ag.office],['Chi phí cố định',ag.fixed],['Marketing',ag.marketing],['Khấu hao',ag.dep],['Chi phí khác',ag.other],['Lợi nhuận',Math.max(0,profit)]];
 let used=0;const total=Math.max(ag.net,raw.reduce((s,r)=>s+r[1],0)),radius=61,C=2*Math.PI*radius;
 const rings=raw.map(([label,val],i)=>{const v=Math.max(0,val),stroke=STG_COLORS[i%STG_COLORS.length],seg=`<circle cx="100" cy="100" r="${radius}" fill="none" stroke="${stroke}" stroke-width="25" stroke-dasharray="${(C*v/total).toFixed(3)} ${(C*(1-v/total)).toFixed(3)}" stroke-dashoffset="${(-C*used/total).toFixed(3)}" transform="rotate(-90 100 100)"><title>${label}: ${stgCash(val)}</title></circle>`;used+=v;return seg}).join('');
 return `<div class="stg-donut-row"><svg viewBox="0 0 200 200" class="stg-donut" aria-label="Biểu đồ vòng cơ cấu chi phí">${rings}<text x="100" y="95" text-anchor="middle" font-size="22" font-weight="800" fill="#203b50">100đ</text><text x="100" y="112" text-anchor="middle" font-size="10" fill="#7a8b9d">doanh thu thuần</text></svg><div class="stg-donut-legend">${raw.map(([label,val],i)=>`<div><i style="background:${STG_COLORS[i%STG_COLORS.length]}"></i><span>${label}</span><b>${stgPct(val/ag.net*100)}</b></div>`).join('')}${profit<0?`<div class="stg-negative">Lỗ: ${stgCash(-profit)}</div>`:''}</div></div>`;
}
function stgProfitColumns(rows){const non=rows.filter(r=>Number.isFinite(r.profit));if(!non.length)return stgEmpty('Cần đủ doanh thu và chi phí để tính lợi nhuận trước thuế.');const max=Math.max(1,...non.map(p=>Math.abs(p.profit)))*1.08;
 return `<div class="stg-colchart"><div class="stg-col-main">${rows.map(r=>{if(!Number.isFinite(r.profit))return `<div class="stg-col"><div class="stg-col-plot"></div><small>${safe(r.label)}</small></div>`;let v=r.profit,h=Math.max(2,Math.abs(v)/max*94);return `<div class="stg-col"><div class="stg-col-plot"><span class="${v<0?'neg':'pos'}" style="height:${h}%" title="${safe(r.full)}: ${stgCash(v)}"></span></div><small>${safe(r.label)}</small></div>`}).join('')}</div><div class="stg-col-baseline"></div><div class="stg-chart-foot"><span><i class="stg-dot" style="background:#208e75"></i>Lãi</span><span><i class="stg-dot" style="background:#db6a65"></i>Lỗ</span><span>12 tháng gần nhất</span></div></div>`;
}
function stgBreakeven(a){if(!a.hasCosts||!a.days||!a.sold||!Number.isFinite(a.profit))return stgEmpty('Chưa có đủ giá bán, sản lượng và chi phí để tính điểm hòa vốn.');
 const d=a.days,price=a.net/a.sold,extra=(a.food+a.prodLabor+a.office+a.marketing+a.dep+a.other)/a.sold,margin=price-extra,be=margin>0?Math.ceil((a.fixed/d)/margin):null,actual=a.sold/d;
 const max=Math.max(actual,be||0,1)*1.18;
 return `<div class="stg-be"><div class="stg-be-grid"><div><small>Sản lượng bán bình quân/ngày</small><strong>${stgFmt(actual)} phần</strong></div><div><small>Điểm hòa vốn ước tính/ngày</small><strong>${be===null?'Chưa tính được':stgFmt(be)+' phần'}</strong></div></div><div class="stg-be-bars"><div class="stg-be-label">Đang bán</div><div class="stg-be-track"><span style="width:${actual/max*100}%;background:#208e75"></span></div><div class="stg-be-label">Hòa vốn</div><div class="stg-be-track"><span style="width:${(be||0)/max*100}%;background:#e77933"></span></div></div><div class="stg-be-bottom">${be===null?'Biên đóng góp chưa dương.':actual>=be?`Vượt điểm hòa vốn khoảng ${stgFmt(actual-be)} phần/ngày.`:`Cần bán thêm khoảng ${stgFmt(be-actual)} phần/ngày để hòa vốn.`}</div></div>`;
}
function stgScenario(a){if(!a.hasCosts||!a.days||!a.sold||!a.net)return stgEmpty('Chỉ thực hiện mô phỏng khi có đầy đủ giá bán, sản lượng và chi phí.');
 const price=Math.round(a.gross/a.sold),units=Math.round(a.sold/a.days),waste=Math.round(a.cancel/a.sold*1000)/10;
 const attrs=`data-price="${price}" data-units="${units}" data-waste="${waste}" data-cost="${(a.food/a.sold).toFixed(4)}" data-disc="${(1-a.net/a.gross).toFixed(6)}" data-fixed="${(a.fixed/a.days).toFixed(4)}"`;
 return `<div class="stg-scenario" id="stgScenario" ${attrs}><div class="stg-scenario-head"><div><small>Điều chỉnh các giả định để so sánh</small></div><button type="button" onclick="stgResetScenario()">↻ Mặc định</button></div><div class="stg-scenario-inputs"><label>Giá bán/phần (đ)<input id="stgPrice" type="number" min="1000" step="1000" value="${price}" oninput="stgUpdateScenario()"></label><label>Bán/ngày (phần)<input id="stgUnits" type="number" min="0" step="1" value="${units}" oninput="stgUpdateScenario()"></label><label>Tỷ lệ hủy (%)<input id="stgWaste" type="number" min="0" max="80" step=".1" value="${waste}" oninput="stgUpdateScenario()"></label></div><div class="stg-result-grid"><div><small>Lãi góp/phần</small><strong id="stgContribution">—</strong></div><div><small>Hòa vốn/ngày</small><strong id="stgBreakEven">—</strong></div><div><small>Lãi 30 ngày</small><strong id="stgProfit30">—</strong></div><div><small>So với mức hiện tại</small><strong id="stgProfitDelta">—</strong></div></div><p class="stg-caption">Kịch bản chỉ phục vụ phân tích. Giá, sản lượng và tỷ lệ hủy điều chỉnh tại đây không thay đổi giá bán, tồn kho hoặc phiếu thực tế.</p></div>`;
}
function stgUpdateScenario(){const d=document.getElementById('stgScenario');if(!d)return;const el=id=>document.getElementById(id),p=Number(el('stgPrice').value),q=Number(el('stgUnits').value),w=Number(el('stgWaste').value),cost=Number(d.dataset.cost),disc=Number(d.dataset.disc),fixed=Number(d.dataset.fixed);
 const baseP=Number(d.dataset.price),baseQ=Number(d.dataset.units),baseW=Number(d.dataset.waste);
 if(!Number.isFinite(p)||p<=0||!Number.isFinite(q)||q<0||!Number.isFinite(w)||w<0||w>=100){for(const id of ['stgContribution','stgBreakEven','stgProfit30','stgProfitDelta'])el(id).textContent='Kiểm tra giá trị';return}
 const calc=(price,qty,waste)=>{const net=price*(1-disc),adjust=cost/(1-waste/100),contrib=net*(1-.13-.08-.045-.025-.028)-adjust;return{contrib,be:contrib>0?Math.ceil(fixed/contrib):null,profit:(contrib*qty-fixed)*30}}
 const r=calc(p,q,w),b=calc(baseP,baseQ,baseW);el('stgContribution').textContent=stgCash(r.contrib);el('stgBreakEven').textContent=r.be===null?'Không hòa vốn':stgFmt(r.be)+' phần';el('stgProfit30').textContent=stgCash(r.profit);const delta=r.profit-b.profit;el('stgProfitDelta').textContent=(delta>=0?'+':'')+stgCash(delta);el('stgProfitDelta').className=delta>=0?'stg-green':'stg-red';}
function stgResetScenario(){const d=document.getElementById('stgScenario');if(!d)return;document.getElementById('stgPrice').value=d.dataset.price;document.getElementById('stgUnits').value=d.dataset.units;document.getElementById('stgWaste').value=d.dataset.waste;stgUpdateScenario()}
function stgDetail(a){if(!a.hasCosts||!a.storeRows.length)return stgEmpty('Chưa có dữ liệu cấp điểm bán hoặc món để đối chiếu.');let byStore=stg.showTable==='stores';const rows=(byStore?a.storeRows:a.dishRows).slice().sort((x,y)=>byStore?y.contribution-x.contribution:y.profit-x.profit);
 return `<div class="stg-table-tabs"><button class="${byStore?'on':''}" onclick="stg.showTable='stores';render()">Điểm bán</button><button class="${!byStore?'on':''}" onclick="stg.showTable='dishes';render()">Món bán</button></div><div class="stg-tablewrap"><table class="stg-table"><thead><tr><th>${byStore?'Điểm bán':'Món'}</th><th>Số phần</th><th>Doanh thu thuần</th><th>Giá vốn</th><th>${byStore?'Lãi góp (ước tính)':'Lợi nhuận gộp'}</th>${byStore?'<th>Hủy (%)</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td><b>${safe(r.name)}</b><small>${safe(r.id)}</small></td><td>${stgFmt(r.sold)}</td><td>${stgCash(r.net)}</td><td>${stgCash(r.food)}</td><td class="${(byStore?r.contribution:r.profit)<0?'stg-red':'stg-green'}">${stgCash(byStore?r.contribution:r.profit)}</td>${byStore?'<td>'+stgPct(r.sold?r.cancel/r.sold*100:0)+'</td>':''}</tr>`).join('')}</tbody></table></div>`;

function stgChartBlocks(a){const periods=stgPeriods(),profitLast12=[];for(let i=11;i>=0;i--){let d=v15Date(stg.anchor);d.setDate(1);d.setMonth(d.getMonth()-i);const dt=v15ISO(d),r=stgRange('month',dt),v=stgAgg(r.start,r.end);profitLast12.push({label:String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2),full:r.label,profit:v.hasCosts&&v.days?v.profit:null});}

 ${stgPanel('Chi tiết theo điểm bán và món bán','Bảng dữ liệu kiểm tra bên dưới các biểu đồ • Sắp xếp theo hiệu quả',stgDetail(a),true)}
